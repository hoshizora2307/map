<style>
:root{
  --sky1:#d3e5ff; --sky2:#fbdcea; --sky3:#dff7df;
  --brown:#6b4a3a; --brown-soft:#9a7a66;
  --pink:#ffb6c1; --pink-deep:#ff8fb0; --pink-pale:#ffebf0;
  --blue:#a3d5ff; --blue-pale:#eaf4ff;
  --butter:#f4c28d; --butter-deep:#c98a4b; --butter-pale:#fff5eb;
  --lemon:#fff3a1; --mint:#bdebc8; --mint-deep:#5cb87a;
  --coral:#ff6b8b;
  --cloud:rgba(255,255,255,.88);
}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,var(--sky1) 0%,var(--sky2) 50%,var(--sky3) 100%);background-attachment:fixed;
  color:var(--brown);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:"Baloo 2","Zen Maru Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}

.head{padding:20px 18px 6px}
.head .row{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.head img{width:64px;filter:drop-shadow(0 4px 8px rgba(107,74,58,.25));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.head .title-cloud{background:var(--cloud);border:4px solid var(--pink);border-radius:40px;padding:10px 26px;box-shadow:0 6px 16px rgba(107,74,58,.12)}
.head h1{font-size:19px;font-weight:900;color:var(--pink-deep);text-shadow:1px 1px 0 #fff}
.head .sub{font-size:11px;font-weight:700;color:var(--brown-soft)}
.head .spacer{flex:1}
.head .staff-chip{background:var(--cloud);border:3px solid var(--blue);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(107,74,58,.1)}

.bar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}
.bar select,.bar input[type=date]{border:3px solid var(--pink);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;font-family:inherit;color:var(--brown);background:#fff;outline:none}
.candy-btn{font-family:inherit;font-weight:900;font-size:13px;color:var(--brown);background:var(--butter);border:none;border-radius:999px;padding:11px 20px;cursor:pointer;
  box-shadow:0 4px 0 var(--butter-deep),0 7px 8px rgba(107,74,58,.18);transition:all .08s}
.candy-btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--butter-deep),0 2px 3px rgba(107,74,58,.18)}
.candy-btn.pink{background:var(--pink-deep);color:#fff;box-shadow:0 4px 0 #d8607f,0 7px 8px rgba(107,74,58,.18)}
.candy-btn.pink:active{box-shadow:0 0 0 #d8607f,0 2px 3px rgba(107,74,58,.18)}
.candy-btn.mint{background:var(--mint);box-shadow:0 4px 0 var(--mint-deep),0 7px 8px rgba(107,74,58,.18)}
.candy-btn.mint:active{box-shadow:0 0 0 var(--mint-deep),0 2px 3px rgba(107,74,58,.18)}
.candy-btn:disabled{background:#ddd;box-shadow:0 4px 0 #aaa;cursor:not-allowed;transform:none}
.status{font-size:11.5px;font-weight:700;color:var(--brown-soft)}
.status.err{color:var(--coral)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint-deep);margin-right:5px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.stat-card{background:var(--cloud);border:3px solid var(--blue);border-radius:22px;padding:14px 16px;box-shadow:0 5px 12px rgba(107,74,58,.08);text-align:center}
.stat-card:nth-child(2){border-color:var(--pink)}
.stat-card:nth-child(3){border-color:var(--butter)}
.stat-card:nth-child(4){border-color:var(--mint)}
.stat-card .label{font-size:11px;font-weight:700;color:var(--brown-soft)}
.stat-card .value{font-size:21px;font-weight:800;margin-top:2px;color:var(--brown)}
.stat-card .value.money{color:var(--coral)}

.chart-card{background:var(--cloud);border:4px solid var(--pink);border-radius:24px;padding:18px;margin-top:16px;box-shadow:0 6px 16px rgba(107,74,58,.1)}
.chart-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chart-tabs button{font-family:inherit;background:#fff;border:2px solid var(--pink);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:900;color:var(--brown-soft);cursor:pointer}
.chart-tabs button.active{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}
.chart-wrap{position:relative;height:280px}

.daygroup{margin-top:28px}
.daygroup h2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;background:var(--cloud);border:3px solid var(--butter);border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:900;box-shadow:0 4px 10px rgba(107,74,58,.08)}
.daygroup h2 .weather{font-size:11px;font-weight:700;color:var(--brown-soft)}
.daygroup h2 .sum{color:var(--coral)}

.order{background:var(--cloud);border:3px solid var(--pink);border-radius:22px;padding:16px 18px;margin-top:12px;box-shadow:0 5px 12px rgba(107,74,58,.08)}
.order.done{border-color:var(--mint)}
.order .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.order .badge{font-size:11px;font-weight:900;padding:4px 14px;border-radius:999px;background:var(--coral);color:#fff}
.order.done .badge{background:var(--mint-deep)}
.order .time{font-size:11px;font-weight:700;color:var(--brown-soft)}
.order .who{font-size:16px;font-weight:900;margin-top:8px}
.order .meta{font-size:12px;font-weight:500;color:var(--brown-soft);margin-top:4px;line-height:1.9}
.order .items{margin-top:10px;padding-top:10px;border-top:2px dashed var(--pink);font-size:13px;font-weight:700}
.order.done .items{border-top-color:var(--mint)}
.order .items div{display:flex;justify-content:space-between;padding:2px 0}
.order .total{margin-top:6px;text-align:right;font-size:18px;font-weight:800;color:var(--coral)}
.order .note{margin-top:8px;background:var(--butter-pale);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--brown-soft)}

.ship-zone{margin-top:12px;background:var(--pink-pale);border:2px dashed var(--pink-deep);border-radius:16px;padding:12px 14px}
.ship-zone .ship-label{font-size:12px;font-weight:900;color:var(--pink-deep);margin-bottom:8px}
.ship-row{display:flex;gap:8px;flex-wrap:wrap}
.ship-row input{flex:1;min-width:170px;border:3px solid var(--pink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:700;font-family:inherit;color:var(--brown);outline:none}
.ship-row input:focus{border-color:var(--pink-deep)}
.shipped-info{margin-top:12px;background:#f0fbf2;border:2px dashed var(--mint-deep);border-radius:16px;padding:11px 14px;font-size:12px;font-weight:700;color:var(--brown-soft);line-height:1.9}
.shipped-info b{color:var(--mint-deep)}
.unship{display:inline-block;margin-top:6px;font-size:11px;color:var(--brown-soft);text-decoration:underline;cursor:pointer}
.del-order{display:block;margin-top:10px;text-align:right;font-size:10.5px;color:#c9a8a8;text-decoration:underline;cursor:pointer}
.del-order:hover{color:var(--coral)}

.empty{background:var(--cloud);border:4px solid var(--blue);border-radius:24px;text-align:center;padding:44px 20px;margin-top:20px;font-size:14px;font-weight:700;color:var(--brown-soft)}
.empty img{width:90px;margin-bottom:12px;animation:bob 3s ease-in-out infinite}

.login-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--cloud);border:4px solid var(--pink);border-radius:28px;padding:34px 30px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(107,74,58,.15)}
.login-box img{width:110px;animation:bob 3s ease-in-out infinite}
.login-box h2{font-size:19px;font-weight:900;color:var(--pink-deep);margin:12px 0 4px;text-shadow:1px 1px 0 #fff}
.login-box p{font-size:12px;font-weight:700;color:var(--brown-soft);margin-bottom:18px}
.login-box input{width:100%;border:3px solid var(--pink);border-radius:999px;padding:12px 16px;font-size:14px;font-weight:700;font-family:inherit;text-align:center;letter-spacing:.06em;color:var(--brown);outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--pink-deep)}
.login-box .candy-btn{width:100%}
.login-err{color:var(--coral);font-size:12px;font-weight:700;margin-top:12px;display:none}
.login-err.show{display:block}

.modal-bg{position:fixed;inset:0;background:rgba(107,74,58,.35);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--cloud);border:4px solid var(--blue);border-radius:28px;padding:28px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(107,74,58,.2)}
.modal img{width:80px}
.modal h3{font-size:16px;font-weight:900;margin:10px 0 4px}
.modal p{font-size:12px;font-weight:700;color:var(--brown-soft);margin-bottom:14px}
.modal input{width:100%;border:3px solid var(--blue);border-radius:999px;padding:11px 16px;font-size:14px;font-weight:700;font-family:inherit;text-align:center;color:var(--brown);outline:none;margin-bottom:12px}
.modal .candy-btn{width:100%}

.purin-toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:300;display:none;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.purin-toast.show{display:flex;animation:purinFloat 4s ease-in-out forwards}
.purin-toast img{width:110px;filter:drop-shadow(0 12px 22px rgba(107,74,58,.3))}
.purin-toast .bubble{background:#fff;border:4px solid var(--pink);border-radius:22px;padding:15px 24px;font-weight:900;font-size:15px;color:var(--brown);box-shadow:0 14px 34px rgba(107,74,58,.2);text-align:center;max-width:290px;line-height:1.7}
@keyframes purinFloat{
  0%{transform:translate(-50%,-260%) scale(.6);opacity:0}
  20%,65%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-260%) scale(.65);opacity:0}
}
@media(prefers-reduced-motion:reduce){
  .purin-toast.show{animation:none;display:none}
  .head img,.login-box img,.empty img{animation:none}
}
#dashboardApp{display:none}
</style>
</head>

<script>
const WORKER_URL = 'https://pudding-orders.hoshizora2307.workers.dev';

const KEY_TTL_DAYS = 30;
function saveDashKey(key){
  try{ localStorage.setItem('dashboardKeyV2', JSON.stringify({ key, exp: Date.now() + KEY_TTL_DAYS*24*60*60*1000 })); }catch(e){}
}
function loadDashKey(){
  try{
    const raw = localStorage.getItem('dashboardKeyV2');
    if(!raw) return '';
    const d = JSON.parse(raw);
    if(!d || !d.key || Date.now() > (d.exp||0)){ localStorage.removeItem('dashboardKeyV2'); return ''; }
    return d.key;
  }catch(e){ return ''; }
}
function clearDashKey(){
  try{ localStorage.removeItem('dashboardKeyV2'); }catch(e){}
}

function getStaffName(){ return localStorage.getItem('deliveryStaffName') || ''; }
function setStaffName(name){
  localStorage.setItem('deliveryStaffName', name);
  document.getElementById('staffNameLabel').textContent = name || '未登録';
}
function ensureStaffName(callback){
  const name = getStaffName();
  if(name){ callback(name); return; }
  document.getElementById('staffModal').classList.add('show');
  document.getElementById('staffNameInput').focus();
  window.__pendingStaffCallback = callback;
}
document.getElementById('staffNameSaveBtn').addEventListener('click', ()=>{
  const val = document.getElementById('staffNameInput').value.trim();
  if(!val) return;
  setStaffName(val);
  document.getElementById('staffModal').classList.remove('show');
  if(window.__pendingStaffCallback){ const cb = window.__pendingStaffCallback; window.__pendingStaffCallback = null; cb(val); }
});
document.getElementById('staffNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('staffNameSaveBtn').click(); });
document.getElementById('changeStaffBtn').addEventListener('click', ()=>{
  document.getElementById('staffNameInput').value = getStaffName();
  document.getElementById('staffModal').classList.add('show');
  document.getElementById('staffNameInput').focus();
});
document.getElementById('staffModal').addEventListener('click', e=>{
  if(e.target.id === 'staffModal' && getStaffName()) document.getElementById('staffModal').classList.remove('show');
});

const listEl = document.getElementById('list');
const statusEl = document.getElementById('statusText');
const filterStatus = document.getElementById('filterStatus');
const filterDate = document.getElementById('filterDate');
let currentOrders = [];
let purinShown = false;

function showPurin(html){
  const bubble = document.getElementById('purinBubble');
  const toast = document.getElementById('purinToast');
  bubble.innerHTML = html;
  toast.classList.remove('show');
  void toast.offsetWidth;
  toast.classList.add('show');
  setTimeout(()=>{ toast.classList.remove('show'); }, 4000);
}

function showTodaysSalesPurin(allOrders){
  const today = localDateStr(new Date().toISOString());
  const todays = allOrders.filter(o => localDateStr(o.receivedAt) === today);
  const total = todays.reduce((s,o)=> s + (parseInt((o.total||'0').replace(/[^\d]/g,''))||0), 0);
  showPurin(todays.length
    ? `きょうの売上は<br><b style="color:var(--coral);font-size:20px" class="num">${fmtYen(total)}</b>（${todays.length}件）だよ！`
    : `きょうはまだ<br>ご注文が入っていないよ`);
}

const OMACHI_LAT = 36.499;
const OMACHI_LON = 137.848;
const weatherCache = {};

function fmtYen(n){ return '¥' + Number(n||0).toLocaleString(); }
function localDateStr(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dayKey(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function timeStr(iso){
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function dateTimeStr(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${timeStr(iso)}`;
}
function esc(v){
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function weatherLabel(code){
  if(code === 0) return '☀️ 晴れ';
  if([1,2,3].includes(code)) return '⛅ 曇り';
  if([45,48].includes(code)) return '🌫️ 霧';
  if([51,53,55,56,57].includes(code)) return '🌦️ 霧雨';
  if([61,63,65,66,67,80,81,82].includes(code)) return '🌧️ 雨';
  if([71,73,75,77,85,86].includes(code)) return '❄️ 雪';
  if([95,96,99].includes(code)) return '⛈️ 雷雨';
  return '― 不明';
}

async function fetchWeather(dateStr){
  if(weatherCache[dateStr] !== undefined) return weatherCache[dateStr];
  weatherCache[dateStr] = null;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${OMACHI_LAT}&longitude=${OMACHI_LON}`
      + `&start_date=${dateStr}&end_date=${dateStr}`
      + `&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.daily && data.daily.time && data.daily.time.length){
      const info = {
        code: data.daily.weathercode[0],
        tmax: Math.round(data.daily.temperature_2m_max[0]),
        tmin: Math.round(data.daily.temperature_2m_min[0]),
      };
      weatherCache[dateStr] = info;
      return info;
    }
  }catch(e){ console.log('weather fetch failed', e); }
  return null;
}

function renderOrder(o){
  const shipped = !!o.shipped;
  const badge = shipped ? '<span class="badge">✓ 発送済み</span>' : '<span class="badge">🍮 発送待ち</span>';
  const who = esc(o.name || '') + ' 様';
  const meta = `${esc(o.address||'')}<br>TEL: ${esc(o.phone||'')}${o.email ? '<br>✉ ' + esc(o.email) : ''}<br>支払い: ${esc(o.payment||'')}${o.src ? ' ／ 経路: ' + esc(o.srcName || o.src) + '（QR）' : ''}`;
  const items = (o.items || []).map(i => `<div><span>${esc(i.name)} × ${esc(i.qty)}</span><span>${esc(i.sub)}</span></div>`).join('');
  const note = o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : '';

  let shipBlock = '';
  if(shipped){
    shipBlock = `<div class="shipped-info">✓ <b>発送済み</b>（${dateTimeStr(o.updatedAt || o.receivedAt)}${o.shippedBy ? ' ／ 担当：' + esc(o.shippedBy) : ''}）<br>伝票番号: <b>${esc(o.trackingNumber||'-')}</b>${o.email ? '　→ 発送メールを ' + esc(o.email) + ' へお届け済み' : ''}<br><span class="unship" data-unship="${o.id}">まちがえた？発送を取り消す</span></div>`;
  } else {
    shipBlock = `<div class="ship-zone">
      <div class="ship-label">🚚 ヤマトさんに渡したら、伝票番号を入れてね</div>
      <div class="ship-row">
        <input type="text" id="track-${o.id}" placeholder="ヤマト伝票番号（半角数字）" inputmode="numeric">
        <button class="candy-btn pink btn-ship" data-id="${o.id}">発送したよ！</button>
      </div>
    </div>`;
  }

  return `<div class="order ${shipped?'done':''}">
    <div class="top">${badge}<span class="time">${timeStr(o.receivedAt)} 受付</span></div>
    <div class="who">${who}</div>
    <div class="meta">${meta}</div>
    <div class="items">${items}</div>
    <div class="total num">${esc(o.total || '')}</div>
    ${note}
    ${shipBlock}
    <span class="del-order" data-del="${o.id}" data-del-name="${esc(o.name||'')}" data-del-total="${esc(o.total||'')}">この注文を削除する（テスト注文の整理用）</span>
  </div>`;
}

function renderStats(orders){
  const panel = document.getElementById('statsPanel');
  const chartCard = document.getElementById('chartCard');
  if(!orders.length){ panel.innerHTML = ''; chartCard.style.display = 'none'; return; }

  const totalRevenue = orders.reduce((s,o)=> s + (parseInt((o.total||'0').replace(/[^\d]/g,''))||0), 0);
  const shippedCount = orders.filter(o=>o.shipped).length;
  const pendingCount = orders.length - shippedCount;
  const avg = Math.round(totalRevenue / orders.length);

  panel.innerHTML = `
    <div class="stat-card"><div class="label">ご注文</div><div class="value num">${orders.length}件</div></div>
    <div class="stat-card"><div class="label">売上合計</div><div class="value num money">${fmtYen(totalRevenue)}</div></div>
    <div class="stat-card"><div class="label">平均単価</div><div class="value num">${fmtYen(avg)}</div></div>
    <div class="stat-card"><div class="label">発送待ち / 済み</div><div class="value num" style="font-size:16px">${pendingCount} / ${shippedCount}</div></div>
  `;

  if(typeof Chart === 'undefined'){
    chartCard.style.display = 'block';
    document.querySelector('.chart-wrap').innerHTML = '<p style="padding:20px;font-size:12.5px;font-weight:700;color:var(--brown-soft)">⚠ グラフの読み込みに失敗しました。注文一覧は下に表示されています。</p>';
    return;
  }
  try{
    chartCard.style.display = 'block';
    renderChart(currentChartType, orders);
  }catch(e){
    console.log('chart render failed', e);
  }
}

let chartInstance = null;
let currentChartType = 'hour';
const CHART_COLORS = ['#ff8fb0','#a3d5ff','#f4c28d','#bdebc8','#fff3a1','#d9b8ff','#ffc9a3','#9ee8e0'];

function buildChartData(type, orders){
  const amountOf = o => parseInt((o.total||'0').replace(/[^\d]/g,'')) || 0;

  if(type === 'hour'){
    const counts = new Array(24).fill(0);
    orders.forEach(o=> counts[new Date(o.receivedAt).getHours()]++);
    return {
      kind: 'bar',
      labels: counts.map((_,h)=>`${h}時`),
      datasets: [{ label:'受付件数', data: counts, backgroundColor: '#ff8fb0', borderRadius: 6 }]
    };
  }
  if(type === 'payment'){
    const map = {};
    orders.forEach(o=>{ const p = o.payment || '不明'; map[p] = (map[p]||0) + 1; });
    return {
      kind: 'pie',
      labels: Object.keys(map),
      datasets: [{ data: Object.values(map), backgroundColor: CHART_COLORS }]
    };
  }
  if(type === 'items'){
    const map = {};
    orders.forEach(o=> (o.items||[]).forEach(i=>{
      map[i.name] = (map[i.name]||0) + (parseInt((i.sub||'0').replace(/[^\d]/g,''))||0);
    }));
    return {
      kind: 'bar',
      labels: Object.keys(map),
      datasets: [{ label:'売上金額', data: Object.values(map), backgroundColor: '#a3d5ff', borderRadius: 6 }],
      horizontal: true
    };
  }
  if(type === 'daily'){
    const map = {};
    orders.forEach(o=>{ const k = localDateStr(o.receivedAt); map[k] = (map[k]||0) + amountOf(o); });
    const days = Object.keys(map).sort();
    return {
      kind: 'line',
      labels: days,
      datasets: [{ label:'売上', data: days.map(d=>map[d]), borderColor:'#ff6b8b', backgroundColor:'rgba(255,143,176,.2)', fill:true, tension:.35, pointBackgroundColor:'#ff6b8b' }]
    };
  }
  if(type === 'src'){
    const map = {};
    orders.forEach(o=>{
      const k = o.src ? (o.srcName || o.src) : 'サイト直接';
      map[k] = (map[k]||0) + amountOf(o);
    });
    return {
      kind: 'bar',
      labels: Object.keys(map),
      datasets: [{ label:'売上金額', data: Object.values(map), backgroundColor: '#f4c28d', borderRadius: 6 }],
      horizontal: true
    };
  }
  if(type === 'staff'){
    const map = {};
    orders.filter(o=>o.shipped && o.shippedBy).forEach(o=>{
      const qty = (o.items||[]).reduce((s,i)=> s + (parseInt(i.qty)||0), 0) || 1;
      map[o.shippedBy] = (map[o.shippedBy]||0) + qty;
    });
    const names = Object.keys(map).sort((a,b)=>map[b]-map[a]);
    return {
      kind: 'bar',
      labels: names.map((n,i)=> (i===0?'👑 ':'') + n),
      datasets: [{ label:'発送した個数', data: names.map(n=>map[n]), backgroundColor: '#bdebc8', borderRadius: 6 }],
      horizontal: true
    };
  }
}

function renderChart(type, orders){
  currentChartType = type;
  const data = buildChartData(type, orders);
  const ctx = document.getElementById('mainChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  Chart.defaults.font.family = "'Zen Maru Gothic', sans-serif";
  Chart.defaults.color = '#9a7a66';

  chartInstance = new Chart(ctx, {
    type: data.kind,
    data: { labels: data.labels, datasets: data.datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: data.horizontal ? 'y' : 'x',
      plugins: { legend: { display: data.kind === 'pie' } }
    }
  });
}

async function updateOrder(id, patch, btn){
  if(btn){ btn.disabled = true; btn.textContent = '送信中…'; }
  try{
    const res = await fetch(WORKER_URL + '/orders/update', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'X-Dashboard-Key': loadDashKey() },
      body: JSON.stringify({ id, ...patch })
    });
    if(res.status === 401){
      clearDashKey();
      showLoginGate('あいことばの有効期限が切れました。もう一度入力してください。');
      return null;
    }
    if(!res.ok) throw new Error('更新に失敗しました');
    return await res.json();
  }catch(e){
    alert('通信エラーが発生しました。もう一度お試しください。\n（' + e.message + '）');
    return null;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '発送したよ！'; }
  }
}

function bindShipButtons(){
  document.querySelectorAll('.btn-ship').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const trackInput = document.getElementById('track-'+id);
      const trackingNumber = trackInput.value.trim();
      if(!trackingNumber){ trackInput.style.borderColor = 'var(--coral)'; trackInput.focus(); return; }
      ensureStaffName(async (staffName)=>{
        const result = await updateOrder(id, { shipped: true, trackingNumber, shippedBy: staffName }, btn);
        if(!result) return;
        const mail = result.emailResult;
        if(mail && mail.sent){
          showPurin('はっそうメールを<br>お客さまにお届けしたよ！<br>おつかれさま！ 🍮');
        } else if(mail && !mail.sent){
          showPurin('発送は記録したけど…<br>メールが送れなかったみたい 💦');
          setTimeout(()=>alert('発送メールを送信できませんでした。\n理由：' + (mail.reason || '不明')), 800);
        } else {
          showPurin('発送を記録したよ！<br>おつかれさま！ 🍮');
        }
        load();
      });
    });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const name = el.dataset.delName || '（名前なし）';
      const total = el.dataset.delTotal || '';
      if(!confirm(`この注文をJSONBinから完全に削除します。\n\n　${name} 様 ／ ${total}\n\n削除すると元に戻せません。本当に削除しますか？`)) return;
      const typed = prompt('確認のため、削除する場合は「さくじょ」と入力してください。');
      if(typed !== 'さくじょ'){ if(typed !== null) alert('入力が一致しなかったため、削除を中止しました。'); return; }
      try{
        const res = await fetch(WORKER_URL + '/orders/delete', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'X-Dashboard-Key': loadDashKey() },
          body: JSON.stringify({ id: el.dataset.del })
        });
        if(res.status === 401){
          clearDashKey();
          showLoginGate('あいことばの有効期限が切れました。もう一度入力してください。');
          return;
        }
        if(!res.ok) throw new Error('削除に失敗しました');
        showPurin(`${name} 様のご注文を<br>削除したよ`);
        load();
      }catch(e){
        alert('削除できませんでした。\n（' + e.message + '）');
      }
    });
  });
  document.querySelectorAll('[data-unship]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('この注文を「発送待ち」に戻します。よろしいですか？\n（お客様に取り消しメールは送信されません）')) return;
      const result = await updateOrder(el.dataset.unship, { shipped: false });
      if(result) load();
    });
  });
}

async function toCsv(orders){
  const header = ['受付日時','発送状況','発送担当','伝票番号','お届け先','お名前','電話番号','メールアドレス','支払い方法','QR経路','商品明細','合計金額','備考','天気','気温(最低〜最高)'];
  const uniqueDates = [...new Set(orders.map(o=>localDateStr(o.receivedAt)))];
  await Promise.all(uniqueDates.map(fetchWeather));

  const rows = orders.map(o=>{
    const itemsStr = (o.items||[]).map(i=>`${i.name}×${i.qty}(${i.sub})`).join(' / ');
    const dateStr = localDateStr(o.receivedAt);
    const w = weatherCache[dateStr];
    const weatherStr = w ? weatherLabel(w.code).replace(/^\S+\s/,'') : '';
    const tempStr = w ? `${w.tmin}〜${w.tmax}℃` : '';
    return [
      new Date(o.receivedAt).toLocaleString('ja-JP'),
      o.shipped ? '発送済み' : '発送待ち',
      o.shippedBy || '',
      o.trackingNumber || '',
      o.address||'', o.name||'', o.phone||'', o.email||'', o.payment||'',
      o.src ? (o.srcName || o.src) : '',
      itemsStr, o.total||'', o.note||'',
      weatherStr, tempStr
    ];
  });
  const escape = v => `"${String(v).replace(/"/g,'""')}"`;
  return [header, ...rows].map(r=>r.map(escape).join(',')).join('\r\n');
}

document.getElementById('csvBtn').addEventListener('click', async ()=>{
  if(!currentOrders.length){ alert('出力するご注文がありません。'); return; }
  const btn = document.getElementById('csvBtn');
  const originalText = btn.textContent;
  btn.textContent = '天気を調べ中…';
  btn.disabled = true;
  try{
    const csv = '\uFEFF' + await toCsv(currentOrders);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `注文一覧_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
});

async function load(){
  statusEl.classList.remove('err');
  statusEl.innerHTML = '<span class="dot" style="background:var(--butter-deep)"></span>読み込み中…';
  try{
    const res = await fetch(WORKER_URL + '/orders', {
      headers: { 'X-Dashboard-Key': loadDashKey() }
    });
    if(res.status === 401){
      clearDashKey();
      showLoginGate('あいことばが違うか、時間が経って無効になりました。もう一度入力してください。');
      return;
    }
    if(!res.ok) throw new Error('取得に失敗しました');
    const data = await res.json();
    const allOrders = data.orders || [];

    if(!purinShown){
      purinShown = true;
      showTodaysSalesPurin(allOrders);
    }

    let orders = allOrders;
    if(filterStatus.value === 'pending') orders = orders.filter(o => !o.shipped);
    else if(filterStatus.value === 'shipped') orders = orders.filter(o => !!o.shipped);
    if(filterDate.value){
      orders = orders.filter(o => localDateStr(o.receivedAt) === filterDate.value);
    }

    await render(orders);
    statusEl.innerHTML = '<span class="dot"></span>最新の状態だよ（' + new Date().toLocaleTimeString('ja-JP') + '）';
  }catch(e){
    statusEl.classList.add('err');
    statusEl.textContent = '⚠ 取得できませんでした。（' + e.message + '）';
    console.log('load() failed:', e);
  }
}

document.getElementById('refreshBtn').addEventListener('click', load);
filterStatus.addEventListener('change', load);
filterDate.addEventListener('change', load);

  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('dashboardApp').style.display = 'block';
  setStaffName(getStaffName());
  load();
  if(!pollTimer) pollTimer = setInterval(load, 20000);
}

function showLoginGate(errMsg){
  document.getElementById('dashboardApp').style.display = 'none';
  document.getElementById('loginGate').style.display = 'flex';
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  const errEl = document.getElementById('loginErr');
  if(errMsg){ errEl.textContent = errMsg; errEl.classList.add('show'); }
  else { errEl.classList.remove('show'); }
  document.getElementById('dashboardKeyInput').focus();
}

async function tryLogin(){
  const key = document.getElementById('dashboardKeyInput').value.trim();
  if(!key) return;
  try{
    const res = await fetch(WORKER_URL + '/orders', { headers: { 'X-Dashboard-Key': key } });
    if(res.status === 401){
      clearDashKey();
      document.getElementById('loginErr').textContent = 'あいことばが違うみたい…。もう一度お試しください。';
      document.getElementById('loginErr').classList.add('show');
      return;
    }
    saveDashKey(key);
    startApp();
  }catch(e){
    document.getElementById('loginErr').textContent = '接続に失敗しました。時間をおいて再度お試しください。';
    document.getElementById('loginErr').classList.add('show');
  }
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('dashboardKeyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

if(loadDashKey()){
  startApp();
} else {
  showLoginGate();
}
</script>
</body>
</html>
